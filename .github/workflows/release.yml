name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate version
        shell: pwsh
        run: |
          $source = Get-Content CMakeLists.txt -Raw
          $match = [regex]::Match($source, 'project\(FpgaDmaMultiTool VERSION ([0-9]+\.[0-9]+\.[0-9]+)')
          if (-not $match.Success -or $env:RELEASE_TAG -ne ('v' + $match.Groups[1].Value)) { throw 'Release tag must match CMake project version' }
      - name: Build and test C++ package
        shell: pwsh
        run: |
          cmake -S . -B build -A x64
          if ($LASTEXITCODE -ne 0) { throw 'CMake configuration failed' }
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          cpack --config build/CPackConfig.cmake -C Release
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG build/package/FPGA-DMA-Multi-Tool-Windows-x64.zip --clobber
          } else {
            gh release create $env:RELEASE_TAG build/package/FPGA-DMA-Multi-Tool-Windows-x64.zip --target $env:GITHUB_SHA --title "FPGA DMA Multi Tool $env:RELEASE_TAG" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
